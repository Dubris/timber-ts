defaults:
- model: config_model
- trainer: config_trainer
- datamodule: config_datamodule_size_50
- _self_  # last: the values below override the groups above
name_experiment: 1_learning_curve
seed: 42
pretrained: null
resume_from: null
discard: null
freeze: null
hydra:
  run:
    dir: .
  output_subdir: null
channel_embedding_init: ${path:assets}/spectral_embeddings_64.npy
training:
  learning_rate: 0.0002
  weight_decay: 0.01
  max_epochs: 30
  compile: true
callbacks:
  checkpoint:
    monitor: val/loss
    mode: min
    save_top_k: 1
    save_last: false
  early_stopping: null
  periodic_checkpoint_every_n_epochs: 5
datamodule:
  num_workers: 4
  read_threads: 16  # concurrent reads per worker (channel-major files)
trainer:
  gradient_clip_val: null
  limit_val_batches: 300
