defaults:
- trainer: config_trainer
- datamodule: config_datamodule_split_1
- _self_
name_experiment: 3_finetuning_hcp_intelligence
name_run: split_1
description_experiment: Finetuning the pretrained model on the HCP dataset to predict
  intelligence measures.
seed: 42
pretrained: ${path:mlruns}/998393602788837357/33ee518f930b477eb960cfa040bfdc8c/checkpoints/epoch=29-step=43500.ckpt
resume_from: null
discard: null
freeze:
- timber.tokenizer
- timber.contextualizer
- timber.encoder.blocks.0
- timber.encoder.latents
hydra:
  run:
    dir: .
  output_subdir: null
datamodule:
  use_batch_sampler: false
model:
  head:
    task: regression
    num_outputs: 3
    pooling: mean
    fusion_stage: late
    projection_dim: null
    pooling_input_dropout: 0.0
    num_hidden_layers: 0
    widening_factor: 1.0
    dropout: 0.3
    use_input_norm: false
    label_smoothing: 0.0
    loss_weight: 1.0
    latent_block: null
  decoders: []
  patch_mask_ratio: 0.0
  encoder:
    use_cls_token: false
training:
  learning_rate: 2.0e-05
  weight_decay: 0.01
  head_weight_decay: 0.01
  max_epochs: 20
callbacks:
  checkpoint:
    monitor: val/loss
    mode: min
    save_top_k: 1
    save_last: true
  early_stopping: null
  periodic_checkpoint_every_n_epochs: null
